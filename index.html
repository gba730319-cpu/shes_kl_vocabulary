<!DOCTYPE html>
<html lang="zh-Hant">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活英文單字學習</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans TC", sans-serif;
  background: #f3f6fc;
  color: #263247;
}

header {
  background: linear-gradient(135deg, #2457a7, #5796e8);
  color: white;
  padding: 28px 16px;
  text-align: center;
}

header h1 {
  margin: 0 0 10px;
  font-size: 30px;
}

header p {
  margin: 0;
}

main {
  max-width: 1000px;
  margin: 22px auto;
  padding: 0 14px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
}

input, select, button {
  font: inherit;
  border-radius: 10px;
  padding: 11px 13px;
}

input, select {
  border: 1px solid #ccd6e5;
  background: white;
}

input {
  flex: 1;
  min-width: 200px;
}

button {
  border: none;
  background: #2457a7;
  color: white;
  cursor: pointer;
}

button:hover {
  opacity: 0.85;
}

.summary {
  margin: 12px 0;
  color: #64748b;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
  gap: 14px;
}

.card {
  background: white;
  border: 1px solid #dce4f0;
  border-radius: 16px;
  padding: 17px;
  box-shadow: 0 3px 12px #00000008;
}

.number {
  color: #7b8798;
  font-size: 13px;
}

.word {
  font-size: 24px;
  font-weight: bold;
  color: #2457a7;
  margin: 10px 0;
  overflow-wrap: anywhere;
}

.chinese {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 8px;
}

.meta {
  color: #64748b;
  font-size: 14px;
  margin-bottom: 13px;
  overflow-wrap: anywhere;
}

.example {
  border-top: 1px solid #e7edf5;
  padding-top: 12px;
  line-height: 1.6;
}

.example-en {
  font-weight: bold;
}

.example-zh {
  color: #64748b;
  margin-top: 4px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.actions button {
  flex: 1;
  min-width: 100px;
  font-size: 14px;
}

.secondary {
  background: #e8effb;
  color: #2457a7;
}

.hidden {
  display: none;
}

.empty {
  padding: 30px;
  text-align: center;
  color: #64748b;
}

footer {
  text-align: center;
  color: #7b8798;
  padding: 25px 10px;
  font-size: 13px;
}
</style>

<body>

<header>
  <h1>📘 生活英文單字學習</h1>
  <p>每天學一點英文，讓生活更有趣！</p>
</header>

<main>

  <section class="controls">
    <input
      id="search"
      type="search"
      placeholder="搜尋中文或英文，例如：起床、get up"
    >

    <select id="category">
      <option value="">全部主題</option>
      <option value="日常作息">日常作息</option>
      <option value="時間">時間</option>
      <option value="個人清潔">個人清潔</option>
      <option value="吃飯">吃飯</option>
      <option value="上學學習">上學學習</option>
      <option value="家庭休閒">家庭休閒</option>
    </select>

    <button id="reset" class="secondary">顯示全部</button>
  </section>

  <div class="summary" id="summary"></div>

  <section class="grid" id="wordList"></section>

  <div id="empty" class="empty hidden">
    找不到符合條件的單字，請試試其他關鍵字。
  </div>

</main>

<footer>
  生活英文單字學習網站｜英文發音使用瀏覽器語音功能
</footer>

const grid = document.getElementById("wordList");
const search = document.getElementById("search");
const category = document.getElementById("category");
const summary = document.getElementById("summary");
const empty = document.getElementById("empty");

function speak(text) {
  if (!("speechSynthesis" in window)) {
    alert("目前瀏覽器不支援英文朗讀，請改用 Safari 或 Chrome。");
    return;
  }
  window.speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speech.rate = 0.85;
  window.speechSynthesis.speak(speech);
}

function makeCard(w, index) {
  const card = document.createElement("article");
  card.className = "card";

  const number = document.createElement("div");
  number.className = "number";
  number.textContent = `第 ${index + 1} 個 · ${w.cat}`;

  const word = document.createElement("div");
  word.className = "word";
  word.textContent = w.en;

  const chinese = document.createElement("div");
  chinese.className = "chinese";
  chinese.textContent = w.zh;

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `${w.pos}　KK：${w.kk}`;

  const example = document.createElement("div");
  example.className = "example";

  const exampleEn = document.createElement("div");
  exampleEn.className = "example-en";
  exampleEn.textContent = w.ex;

  const exampleZh = document.createElement("div");
  exampleZh.className = "example-zh";
  exampleZh.textContent = w.exzh;

  example.append(exampleEn, exampleZh);

  const actions = document.createElement("div");
  actions.className = "actions";

  const wordButton = document.createElement("button");
  wordButton.textContent = "🔊 聽單字";
  wordButton.addEventListener("click", () => speak(w.en));

  const sentenceButton = document.createElement("button");
  sentenceButton.className = "secondary";
  sentenceButton.textContent = "🔊 聽例句";
  sentenceButton.addEventListener("click", () => speak(w.ex));

  actions.append(wordButton, sentenceButton);
  card.append(number, word, chinese, meta, example, actions);
  return card;
}

function render() {
  const q = search.value.trim().toLowerCase();
  let list = WORDS.filter(w =>
    (!q || `${w.en} ${w.zh} ${w.pos} ${w.cat} ${w.ex}`.toLowerCase().includes(q)) &&
    (!category.value || w.cat === category.value)
  );

  grid.replaceChildren();
  list.forEach((w) => grid.appendChild(makeCard(w, WORDS.indexOf(w))));
  summary.textContent = `顯示 ${list.length} 個，共 ${WORDS.length} 個單字與片語`;
  empty.classList.toggle("hidden", list.length > 0);
}

search.addEventListener("input", render);
category.addEventListener("change", render);
document.getElementById("reset").addEventListener("click", () => {
  search.value = "";
  category.value = "";
  render();
});

render();
