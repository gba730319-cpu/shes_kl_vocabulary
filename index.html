<script>
/* 語音包：單字整包 (us-words.js/uk-words.js) + 例句逐句動態載入 (audio/us|uk/sNNN.mp3) */
window.AUD={};window.AUD_READY={};
const AUDFAIL=new Set();let A=null;
let curText=null,playing=false;
const SENT_CACHE=new Map(),SENT_FETCHING=new Set();
try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
function hookAudio(a,el,tk,t){
 try{a.playbackRate=+$("sp").value||1}catch(e){}
 curText=t;playing=true;A=a;
 a.onended=()=>{if(tk===seq){el.classList.remove("on");if(curText===t){playing=false;A=null}}};
 a.onerror=()=>{if(tk===seq&&curText===t){playing=false;A=null}};
 const p=a.play();
 if(p&&p.catch)p.catch(()=>{if(tk!==seq)return;AUDFAIL.add(t);playing=false;A=null;say(t,el,0,tk)});
}
function playClip(t,el,tk){
 const AU=window.AUD||{};
 const k=acc==="en-GB"?"uk":"us";
 const d=(AU[k]||{})[t];
 try{speechSynthesis.cancel()}catch(e){}
 if(A){try{A.pause()}catch(e){}A=null}
 if(cur&&cur!==el)cur.classList.remove("on");cur=el;el.classList.add("on");
 if(d&&!AUDFAIL.has(t)){hookAudio(new Audio("data:audio/mpeg;base64,"+d),el,tk,t);return true}
 if(AUDFAIL.has(t))return false;
 const idx=((window.SENT_IDX||{})[k]||{})[t];
 if(idx){
  const ck=k+":"+t,cached=SENT_CACHE.get(ck);
  if(cached){hookAudio(new Audio(cached),el,tk,t);return true}
  if(!SENT_FETCHING.has(ck)){
   SENT_FETCHING.add(ck);
   fetch("audio/"+k+"/"+idx+".mp3").then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>{
    SENT_CACHE.set(ck,URL.createObjectURL(b));SENT_FETCHING.delete(ck);
   }).catch(()=>{SENT_FETCHING.delete(ck);AUDFAIL.add(t)});
  }
  return false;
 }
 if(!window.AUD_READY[k+"-words"])loadAudio();
 return false;
}
function loadAudio(){
 const k=(typeof acc!=="undefined"&&acc==="en-GB")?"uk":"us";
 const wf=k+"-words.js";
 if(!document.querySelector('script[data-aud="'+wf+'"]')){
  const s=document.createElement("script");
  s.src=wf;s.async=true;s.setAttribute("data-aud",wf);
  s.onload=()=>{window.AUD_READY[wf]=true};
  document.head.appendChild(s);
 }
 if(!document.querySelector('script[data-aud="sents-index.js"]')){
  const s=document.createElement("script");
  s.src="sents-index.js";s.async=true;s.setAttribute("data-aud","sents-index.js");
  document.head.appendChild(s);
 }
}
loadAudio();
</script>

$("se").onchange=e=>document.body.classList.toggle("nose",!e.target.checked);
$("kk").onchange=e=>document.body.classList.toggle("nokk",!e.target.checked);
L.addEventListener("change",e=>{const n=+e.target.dataset.n;if(!n)return;e.target.checked?sel.add(n):sel.delete(n);cnt()});
$("sa").onclick=()=>{shown.forEach(x=>sel.add(x.n));render()};
$("sall").onclick=()=>{W.forEach(x=>sel.add(x.n));render();$("msg").textContent="已全選 200 字。"};
function rng(add){
 let a=parseInt($("ra").value),b=parseInt($("rb").value);
 if(isNaN(a)&&isNaN(b)){$("msg").textContent="請輸入起始與結束編號，例如 51 到 80。";return}
 if(isNaN(a))a=b;if(isNaN(b))b=a;
 if(a>b)[a,b]=[b,a];a=Math.max(1,a);b=Math.min(200,b);
 let c=0;for(let i=a;i<=b;i++){if(add&&!sel.has(i)){sel.add(i);c++}if(!add&&sel.has(i)){sel.delete(i);c++}}
 if(add){rg.value="0";$("q").value=""}
 render();
 $("msg").textContent=(add?"已加入 ":"已取消 ")+c+" 字（"+a+"–"+b+"），目前共選 "+sel.size+" 字。";
}
$("radd").onclick=()=>rng(true);$("rdel").onclick=()=>rng(false);
$("sc").onclick=()=>{sel.clear();render()};
function printPdf(){
 if(!sel.size){$("msg").textContent="請先勾選要匯出的單字，或按「全選目前範圍」。";return}
 const z=$("pz").checked,t=$("ps").checked,d=W.filter(x=>sel.has(x.n));
 $("pv").innerHTML=`<h2>G4 Advanced M11/M12 單字複習</h2><p>共 ${d.length} 字</p><table><tr><th>#</th><th>Word</th><th>KK</th><th>詞性</th>${z?"<th>中文</th>":""}${t?"<th>Example Sentence</th>":""}</tr>${d.map(x=>`<tr><td>${x.n}</td><td><b>${x.w}</b></td><td class="kk">/${x.k}/</td><td>${x.p}.</td>${z?`<td>${x.z}</td>`:""}${t?`<td>${x.s}${z?`<br>${x.sz}`:""}</td>`:""}</tr>`).join("")}</table>`;
 $("msg").textContent="在列印視窗中，將目的地選為「另存為 PDF」。";
 window.print();
}
$("pd").onclick=async()=>{
 if(!sel.size){$("msg").textContent="請先勾選要匯出的單字，或按「全選目前範圍」。";return}
 if(!window.html2canvas||!window.jspdf){printPdf();return}
 const z=$("pz").checked,t=$("ps").checked,d=W.filter(x=>sel.has(x.n)),btn=$("pd"),lab=btn.textContent;
 btn.disabled=true;$("msg").textContent="產生 PDF 中，請稍候…";
 const host=document.createElement("div");host.className="pvh";document.body.appendChild(host);
 const head="<tr><th>#</th><th>Word</th><th>KK</th><th>詞性</th>"+(z?"<th>中文</th>":"")+(t?"<th>Example Sentence</th>":"")+"</tr>";
 const row=x=>`<tr><td>${x.n}</td><td><b>${x.w}</b></td><td class="kk">/${x.k}/</td><td>${x.p}.</td>${z?`<td>${x.z}</td>`:""}${t?`<td>${x.s}${z?`<br>${x.sz}`:""}</td>`:""}</tr>`;
 const pages=[];
 const mk=first=>{const g=document.createElement("div");g.className="pg";g.innerHTML=(first?`<h2>G4 Advanced M11/M12 單字複習</h2><p>共 ${d.length} 字</p>`:"")+"<table>"+head+"</table>";host.appendChild(g);pages.push(g);return g};
 try{
  let g=mk(true),tb=g.querySelector("table");
  d.forEach(x=>{
   tb.insertAdjacentHTML("beforeend",row(x));
   if(tb.offsetTop+tb.offsetHeight>1123-40&&tb.rows.length>2){
    tb.deleteRow(-1);g=mk(false);tb=g.querySelector("table");tb.insertAdjacentHTML("beforeend",row(x));
   }
  });
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  for(let i=0;i<pages.length;i++){
   $("msg").textContent="產生 PDF 中… "+(i+1)+"/"+pages.length;
   const c=await html2canvas(pages[i],{scale:1.6,backgroundColor:"#ffffff"});
   if(i)doc.addPage();
   doc.addImage(c.toDataURL("image/jpeg",.9),"JPEG",0,0,210,297);
  }
  doc.save("G4-M11-M12-vocab.pdf");
  $("msg").textContent="PDF 已產生（共 "+pages.length+" 頁）。如果沒有自動下載，請到瀏覽器的下載項目或分享選單查看。";
 }catch(e){
  $("msg").textContent="直接產生 PDF 失敗，改用列印功能。";printPdf();
 }finally{host.remove();btn.disabled=false;btn.textContent=lab}
};
rg.onchange=render;$("q").oninput=render;
if("speechSynthesis" in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}
render();
